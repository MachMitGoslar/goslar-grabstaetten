services:
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - tour
      - api
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - friedhof_internal
    restart: unless-stopped

  web:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/machmitgoslar/goslar-grabstaetten}-web:${IMAGE_TAG:-latest}
    platform: linux/amd64
    networks:
      - friedhof_internal
    restart: unless-stopped

  tour:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/machmitgoslar/goslar-grabstaetten}-tour:${IMAGE_TAG:-latest}
    platform: linux/amd64
    networks:
      - friedhof_internal
    restart: unless-stopped

  api:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/machmitgoslar/goslar-grabstaetten}-api:${IMAGE_TAG:-latest}
    platform: linux/amd64
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-grave}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@${POSTGRES_HOST:-db}:5432/${POSTGRES_DB:-gravedb}}


      ANALYTICS_ADMIN_USER: ${ANALYTICS_ADMIN_USER:?ANALYTICS_ADMIN_USER must be set}
      ANALYTICS_ADMIN_PASSWORD: ${ANALYTICS_ADMIN_PASSWORD:?ANALYTICS_ADMIN_PASSWORD must be set}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set}
      FORCE_SECURE_COOKIES: ${FORCE_SECURE_COOKIES:-true}
      SMTP_HOST: ${SMTP_HOST:-mailserver}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be set}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
      mailserver:
        condition: service_started
    networks:
      - friedhof_internal
    restart: unless-stopped

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: ${MAILSERVER_CONTAINER_NAME:-friedhof-mailserver}
    hostname: ${MAILSERVER_HOSTNAME:?MAILSERVER_HOSTNAME must be set}
    domainname: ${MAILSERVER_DOMAINNAME:?MAILSERVER_DOMAINNAME must be set}
    ports:
      - "${MAILSERVER_SMTP_PORT:-25}:25"
      - "${MAILSERVER_SUBMISSION_PORT:-587}:587"
      - "${MAILSERVER_IMAPS_PORT:-993}:993"
    volumes:
      - ./docker-data/dms/mail-data/:/var/mail/
      - ./docker-data/dms/mail-state/:/var/mail-state/
      - ./docker-data/dms/mail-logs/:/var/log/mail/
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
      - ${LETSENCRYPT_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro
    environment:
      ENABLE_SPAMASSASSIN: ${MAILSERVER_ENABLE_SPAMASSASSIN:-0}
      ENABLE_CLAMAV: ${MAILSERVER_ENABLE_CLAMAV:-0}
      ENABLE_FAIL2BAN: ${MAILSERVER_ENABLE_FAIL2BAN:-1}
      LOG_LEVEL: ${MAILSERVER_LOG_LEVEL:-info}
      PERMIT_DOCKER: ${MAILSERVER_PERMIT_DOCKER:-network}
      SSL_TYPE: ${MAILSERVER_SSL_TYPE:-letsencrypt}
    networks:
      - friedhof_internal
    restart: always

  db:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/machmitgoslar/goslar-grabstaetten}-db:${IMAGE_TAG:-latest}
    platform: linux/amd64
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gravedb}
      POSTGRES_USER: ${POSTGRES_USER:-grave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      friedhof_internal:
        aliases:
          - db
    restart: unless-stopped

  db-import:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/machmitgoslar/goslar-grabstaetten}-db-import:${IMAGE_TAG:-latest}
    platform: linux/amd64
    profiles:
      - import
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-grave}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@${POSTGRES_HOST:-db}:5432/${POSTGRES_DB:-gravedb}}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - friedhof_internal
    restart: "no"

volumes:
  postgres_data:

networks:
  friedhof_internal:
